name: retainpdf

services:
  app:
    image: ${APP_IMAGE:-wxyhgk/retainpdf-app:latest}
    build:
      context: ../..
      dockerfile: docker/Dockerfile.app
    restart: unless-stopped
    env_file:
      - ./docker/app.env
    ports:
      - "${APP_PORT:-41000}:41000"
      - "${APP_SIMPLE_PORT:-42000}:42000"
    volumes:
      - app_data:/data
      - ./docker/auth.local.json:/app/backend/rust_api/auth.local.json:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:41000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  mineru:
    profiles:
      - mineru-sidecar
    image: ${MINERU_IMAGE:-retainpdf-mineru:latest}
    build:
      context: ../..
      dockerfile: docker/Dockerfile.mineru
    restart: unless-stopped
    environment:
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-local}
      MINERU_DOWNLOAD_MODELS_ON_START: ${MINERU_DOWNLOAD_MODELS_ON_START:-1}
      MINERU_MODEL_DOWNLOAD_SOURCE: ${MINERU_MODEL_DOWNLOAD_SOURCE:-modelscope}
      MINERU_MODEL_DOWNLOAD_TYPE: ${MINERU_MODEL_DOWNLOAD_TYPE:-pipeline}
    volumes:
      - ./models/mineru:/models/mineru
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m

  web:
    image: ${WEB_IMAGE:-wxyhgk/retainpdf-web:latest}
    build:
      context: ../..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - ./docker/web.env
    ports:
      - "${WEB_PORT:-40001}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  app_data:
